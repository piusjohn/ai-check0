[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicheck0"
version = "1.0.0"
description = "20-Checkpoint, 200-Exercise Automated AI Engineering Curriculum & Grading Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    "pypdf>=4.2.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
aicheck = "aicheck_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
